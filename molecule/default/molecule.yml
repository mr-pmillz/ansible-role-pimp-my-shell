# code: language=ansible
---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: ubuntu-pimp-my-shell
    image: ubuntu:latest
    privileged: true
    pre_build_image: false
    dockerfile: Dockerfile.ubuntu
    env:
      USER: root
  - name: debian-pimp-my-shell
    image: debian:stable
    privileged: true
    pre_build_image: false
    dockerfile: Dockerfile.debian
    env:
      USER: root
  - name: kali-pimp-my-shell
    image: kalilinux/kali-rolling:latest
    privileged: true
    pre_build_image: false
    dockerfile: Dockerfile.kali
    env:
      USER: root
  - name: parrot-pimp-my-shell
    image: parrotsec/core:latest
    privileged: true
    pre_build_image: false
    dockerfile: Dockerfile.parrot
    env:
      USER: root
  - name: mint-pimp-my-shell
    image: linuxmintd/mint22-amd64:latest
    # Only published for amd64, so it is pinned explicitly and needs binfmt/qemu
    # emulation (`docker run --privileged tonistiigi/binfmt --install amd64`) to run
    # on an arm64 host. Every other platform here is a multi-arch image and runs natively.
    platform: linux/amd64
    privileged: true
    pre_build_image: false
    dockerfile: Dockerfile.mint
    env:
      USER: root
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Connection variables belong in Ansible inventory, not Docker platforms.
        ansible_user: root
# Let Molecule prerun supply role paths; cache locations vary by version.
verifier:
  name: ansible
scenario:
  name: default
role_name_check: 1
