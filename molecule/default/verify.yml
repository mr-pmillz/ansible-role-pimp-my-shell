# code: language=ansible
---
- name: Verify both editors and Tree-sitter highlighting
  hosts: all
  gather_facts: true
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  tasks:
    - name: Verify Vim is still installed
      ansible.builtin.command: vim --version
      changed_when: false

    - name: Check separate editor configurations
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
      loop:
        - .vimrc
        - .vim_runtime/my_configs.vim
        - .config/nvim/init.lua
      register: editor_configs

    - name: Verify both editor configurations exist
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
      loop: "{{ editor_configs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Install highlighting regression checks
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tests/neovim.lua"
        dest: /tmp/pimp-my-shell-neovim-verify.lua
        mode: "0644"

    - name: Verify template detection and actual language injections
      ansible.builtin.command:
        argv:
          - nvim
          - --headless
          - -u
          - NONE
          - -i
          - NONE
          - -l
          - /tmp/pimp-my-shell-neovim-verify.lua
      changed_when: false

    - name: Verify highlighting setup is idempotent
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts['env']['HOME'] }}/.config/nvim/highlight.sh"
      register: highlight_verify
      changed_when: false
      failed_when: highlight_verify.rc != 0 or 'HIGHLIGHT_CHANGED=1' in highlight_verify.stdout
