---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          # Newest Python supported by the current ansible-core release.
          python-version: '3.14'

      - name: Install lint tooling
        run: |
          # Keep pip dependencies separate from the runner's distro Python packages.
          python -m venv "$RUNNER_TEMP/pimp-my-shell-venv"
          source "$RUNNER_TEMP/pimp-my-shell-venv/bin/activate"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint
          python -m pip check

      - name: Install galaxy requirements
        run: |
          ansible-galaxy install -r requirements.yml
          ansible-galaxy collection install -r molecule/default/requirements.yml

      - name: Lint with yamllint
        run: yamllint . --format github

      - name: Lint with ansible-lint
        run: ansible-lint

      - name: Test highlighting installer version selection
        run: bash tests/highlight.sh

      - name: Test component upgrade behavior
        run: python tests/upgrades.py

      - name: Test component selection and shell isolation
        run: python tests/selection.py

      - name: Test Neovim fzf installation and shell isolation
        run: python tests/fzf.py

      - name: Test Go installation and upgrade behavior
        run: python tests/go.py

  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common libssl-dev

      - name: Install Molecule tooling
        run: |
          # System pyOpenSSL can be incompatible with pip-installed cryptography.
          python -m venv "$RUNNER_TEMP/pimp-my-shell-venv"
          source "$RUNNER_TEMP/pimp-my-shell-venv/bin/activate"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install molecule "molecule-plugins[docker]" ansible ansible-core ansible-lint docker psutil yamllint
          python -m pip check

      - name: Validate Molecule configuration
        run: |
          molecule --version
          molecule --debug list
          molecule --debug syntax

      - name: Download Molecule base images with retries
        timeout-minutes: 30
        run: ansible-playbook -i localhost, molecule/default/pull.yml

      - name: Run Molecule converge and verify
        run: |
          molecule converge
          molecule verify
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
