---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install lint tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core ansible-lint yamllint

      - name: Install galaxy requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Lint with yamllint
        run: yamllint . --format github

      - name: Lint with ansible-lint
        run: ansible-lint

  molecule:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common libssl-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install molecule "molecule-plugins[docker]" ansible ansible-core ansible-lint docker psutil yamllint

      - name: Run Molecule converge
        run: molecule converge
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
