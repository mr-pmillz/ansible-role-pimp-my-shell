# code: language=ansible
---
- name: Manage the Neovim fuzzy finder
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.fzf/bin:{{ ansible_facts['env']['PATH'] }}:/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin"
    FZF_DEFAULT_OPTS: ""
    FZF_DEFAULT_OPTS_FILE: ""
  block:
    - name: Check the available fzf version
      ansible.builtin.command: fzf --version
      register: pimp_my_shell_fzf_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install missing or incompatible fzf, or explicitly upgrade it
      vars:
        required_fzf_version: "{{ neovim_fzf_version if upgrade_components | bool else neovim_fzf_minimum_version }}"
        installed_fzf_version: "{{ ((pimp_my_shell_fzf_check.stdout | default('')) | regex_findall('^([0-9]+[.][0-9]+[.][0-9]+)') | first) | default('0.0.0') }}"
      when:
        - pimp_my_shell_fzf_check.rc != 0 or installed_fzf_version is version(required_fzf_version, '<')
        - not ansible_check_mode
      block:
        - name: Clone the upstream fzf installer
          ansible.builtin.git:
            repo: https://github.com/junegunn/fzf.git
            dest: "{{ ansible_facts['env']['HOME'] }}/.fzf"
            version: "v{{ neovim_fzf_version }}"
            depth: 1

        # Upstream's --bin mode neither prompts nor writes any shell files.
        # It downloads the native release, falling back to a Go source build.
        - name: Install fzf without changing shell configuration
          ansible.builtin.command:
            argv:
              - bash
              - "{{ ansible_facts['env']['HOME'] }}/.fzf/install"
              - --bin
          changed_when: true

        - name: Verify the installed fzf release
          ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.fzf/bin/fzf --version"
          register: pimp_my_shell_fzf_installed
          changed_when: false
          failed_when: >-
            pimp_my_shell_fzf_installed.rc != 0 or
            not pimp_my_shell_fzf_installed.stdout.startswith(neovim_fzf_version + ' ')

        - name: Create the user executable directory
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
            state: directory
            mode: "0755"

        - name: Activate the compatible fuzzy finder
          ansible.builtin.file:
            src: "{{ ansible_facts['env']['HOME'] }}/.fzf/bin/fzf"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/fzf"
            state: link
            force: true
