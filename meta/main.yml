# code: language=ansible
---
galaxy_info:
  role_name: pimp_my_shell
  namespace: mr_pmillz
  author: mr-pmillz
  description: >-
    Terminal customization for Ubuntu, Debian, Linux Mint, Kali, Parrot,
    and macOS (amd64/arm64) — oh-my-zsh + powerlevel10k, oh-my-tmux + TPM,
    awesome-vimrc, Neovim + LazyVim, bat, fzf, MesloLGS Nerd Fonts, and per-OS terminal profiles.
  company: Black Hills Information Security
  license: Apache-2.0

  min_ansible_version: "2.15"

  platforms:
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: MacOSX
      versions:
        - all

  galaxy_tags:
    - terminal
    - zsh
    - ohmyzsh
    - powerlevel10k
    - tmux
    - vim
    - neovim
    - dotfiles
    - shell
    - macos
    - ubuntu
    - debian
    - kali
    - parrot

# Run the shell dependency only when zsh is selected. In particular,
# only_neovim must not rewrite an existing .zshrc or change the login shell.
# On macOS this role uses the official installer in the zsh component instead.
dependencies:
  - role: gantsign.oh-my-zsh
    vars:
      # This dependency runs first. Its whole-file template must never replace
      # user settings, even when inventory contains an old write_zshrc override.
      users: >-
        {{ oh_my_zsh_users | default([{'username': ansible_facts['user_id']}])
           | map('combine', {'oh_my_zsh': {'write_zshrc': false}}, recursive=true) | list }}
    when:
      - ansible_facts['os_family'] != 'Darwin'
      - "'zsh' in pimp_my_shell_components"
